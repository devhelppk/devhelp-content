name: Check content

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: devhelp-content
      - uses: actions/checkout@v5
        with:
          repository: devhelppk/devhelp-platform
          path: devhelp-platform
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: devhelp-platform/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: devhelp-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: devhelp-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: devhelp-platform
      - run: pnpm content:check ../devhelp-content
        working-directory: devhelp-platform
